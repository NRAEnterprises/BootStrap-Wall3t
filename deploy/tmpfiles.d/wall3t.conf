# BootStrap Wall3t runtime layout.
# Installed by the host administrator; neither service creates or broadens it.
# systemd socket activation creates the socket node because this directory is
# intentionally not writable by wall3t-core or by the wall3t-ipc group.
d /run/wall3t 0750 root wall3t-ipc -
d /run/wall3t/wallet-core 2750 root wall3t-ipc -

# Replay state is separate from the socket directory and is writable only by
# wallet-core. The service must fail closed if this state is absent/corrupt.
d /var/lib/wall3t 0750 root wall3t-core -
d /var/lib/wall3t/wallet-core 0700 wall3t-core wall3t-core -
